@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on:#0a1626;--bg:#0a1626;--surf:#10233a;--tx:#e9f1fa;--mu:#9fb4cb;--pri:#6cc24a;--pri2:#52a436;--bd:#1d3857;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--on:#0a1626;--bg:#0a1626;--surf:#10233a;--tx:#e9f1fa;--mu:#9fb4cb;--pri:#6cc24a;--pri2:#52a436;--bd:#1d3857;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;color:var(--tx);text-decoration:none;white-space:nowrap}.logo b span{color:var(--pri)}
.lg{display:block;background:var(--logo) center/contain no-repeat}.logo .lg{width:64px;height:46px;border-radius:10px;background-color:#fff;border:1px solid var(--bd)}
nav a{color:var(--mu);text-decoration:none;margin:0 10px;font-size:.92rem;font-weight:500}nav a:hover{color:var(--pri)}
.fl{display:flex;gap:8px}
.fl button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;background:none;transition:.2s}
.fl button svg{width:100%;height:100%;display:block}
.fl button[aria-pressed="true"]{border-color:var(--pri);transform:scale(1.1)}
.fl button:hover{transform:scale(1.12)}
.btn{display:inline-block;background:var(--pri);color:var(--on);padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem;box-shadow:var(--sh);transition:.2s}
.btn:hover{background:var(--pri2);transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.hero{padding:72px 0 56px;background:radial-gradient(ellipse at 80% 0,color-mix(in srgb,var(--pri) 22%,transparent),transparent 60%)}
.hero .g{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}

.lead{color:var(--mu);font-size:1.1rem;margin:0 0 26px;max-width:520px}
.tag{display:inline-block;background:color-mix(in srgb,var(--acc) 25%,transparent);color:var(--tx);padding:5px 14px;border-radius:999px;font-size:.82rem;font-weight:700;margin-bottom:14px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.vis{aspect-ratio:1;border-radius:32px;background:#fff;border:1px solid var(--bd);display:grid;place-items:center;box-shadow:var(--sh);position:relative}.vis .lg{width:88%;height:88%}
.offer{background:var(--navy);color:#fff;text-align:center;padding:14px 0;font-weight:600}.offer a{color:#bfe89a;margin-left:8px;font-weight:700;white-space:nowrap}
.vis i{position:absolute;font-style:normal;font-size:2.2rem;animation:fl 4s ease-in-out infinite}
.vis i:nth-child(1){top:12%;left:14%}.vis i:nth-child(2){bottom:14%;right:12%;animation-delay:1.5s}.vis i:nth-child(3){top:18%;right:16%;animation-delay:3s}
@keyframes fl{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.vis i{animation:none}html{scroll-behavior:auto}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stats div{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:center}
.stats b{display:block;font-size:1.6rem;color:var(--pri)}.stats small{color:var(--mu)}
section{padding:64px 0}.sub{text-align:center;color:var(--mu);margin:0 auto 36px;max-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:20px;padding:24px;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--pri)}
.card .ic{font-size:2rem}.card h3{margin:10px 0 6px;font-size:1.1rem}.card p{margin:0;color:var(--mu);font-size:.95rem}
.alt{background:var(--surf);border-block:1px solid var(--bd)}
.num{width:44px;height:44px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.q{font-style:italic}.q small{display:block;margin-top:10px;font-style:normal;font-weight:700;color:var(--pri)}
.form{max-width:560px;margin:0 auto;background:var(--surf);border:1px solid var(--bd);border-radius:24px;padding:26px;box-shadow:var(--sh);display:grid;gap:12px}
.form input,.form select,.form textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--pri);border-color:transparent}
footer{padding:30px 0;text-align:center;color:var(--mu);font-size:.88rem;border-top:1px solid var(--bd)}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.7rem;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30}
@media (max-width:820px){nav{display:none}.hero .g{grid-template-columns:1fr}.vis{width:100%;max-width:280px;margin:0 auto}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding-top:40px}}
